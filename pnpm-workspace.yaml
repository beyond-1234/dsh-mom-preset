# The browser half is a WORKSPACE, not a second deliverable.
#
# `dsh-mom-ui/` has to keep its own package name: `@deepseek-ai/dsh-client-modules`
# collects one active Loader source per package name that declares `dsh.client`,
# and throws when a name resolves from more than one source. The bundle row
# (`./dsh-mom-ui/lib/index.js`) and the preset's `mom-mode` row (the bundle's own
# package name) are both live at once, so folding the browser half into the root
# package would make both rows name one client package — the fiber would fail and
# the whole Web client would go dark.
#
# What it must NOT become is an independently installed package: it renders
# nothing outside a session whose `agentPreset` is `mom`, so a standalone install
# would be dead weight, and a second install route would be exactly the extra
# Loader entry above. Declaring it here (and in the root's `workspaces`) makes
# the relationship explicit without adding a route; `test/bundle.mjs` enforces
# the rest.
packages:
  - dsh-mom-ui

# The harness peer is declared for its VERSION GATE, not to be installed here.
#
# `@deepseek-ai/dsh` is what this preset is written against: its composition is a
# snapshot of that release's shipped `standard` preset, so a row name that exists
# in one line and not another fails the whole preset rather than degrading. The
# peer range is how the host's compatibility check learns which line this targets
# — without a `peerDependencies` entry it returns early and the range is never
# consulted at all, which is why the range has to be declared even though nothing
# here imports the package.
#
# pnpm 12 installs declared peers by default, and the harness is ~1.4 GB of
# packages with native build scripts. Cloning this repository to read one preset
# must not pull that, and `peerDependenciesMeta.optional` does NOT stop it. So the
# auto-install is off, which keeps a checkout at a few files.
#
# Verified: with this set, `pnpm install` here stays empty, and installing this
# package INTO a profile adds only `dsh-mom-preset` — the peer is not dragged into
# anyone's profile either.
autoInstallPeers: false
